<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d35">
<title>Responsible AI at Work | Interactive Training</title>
<style>
:root{color-scheme:light;--navy:#101d35;--ink:#17263d;--muted:#52647a;--blue:#2767d7;--pale:#eef4ff;--white:#fff;--line:#dce5f0;--green:#16744d;--red:#ad3640;--focus:#faaf32}
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.48}.skip{position:absolute;top:-80px;left:12px;background:white;padding:10px;z-index:10}.skip:focus{top:12px}.shell{max-width:1040px;margin:auto;padding:0 24px}.top{background:var(--navy);color:white}.top .shell{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px;padding-bottom:18px}.brand{font-weight:800;letter-spacing:.01em}.tag{font-size:.78rem;color:#d3e1ff;text-transform:uppercase;letter-spacing:.1em}.progress-area{background:white;border-bottom:1px solid var(--line)}.progress-area .shell{display:flex;align-items:center;gap:20px;padding-top:15px;padding-bottom:15px}.progress{height:9px;background:#e6edf8;border-radius:50px;overflow:hidden;flex:1}.progress>div{background:var(--blue);height:100%;width:0;transition:width .2s}.step{color:var(--muted);font-size:.89rem;white-space:nowrap}main{padding:38px 0 60px}.panel{background:white;border:1px solid var(--line);box-shadow:0 12px 34px #182d4a0b;border-radius:20px;padding:clamp(24px,5vw,54px)}.eyebrow{color:var(--blue);font-size:.83rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin:0 0 13px}.hero{background:linear-gradient(130deg,#11223e,#173e72);color:white;padding:clamp(28px,5vw,52px);border-radius:16px;margin:-10px -10px 28px}.hero .eyebrow{color:#b8d7ff}.hero p{color:#e3edfb;max-width:650px}h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.13;margin:.12em 0 .35em;letter-spacing:-.035em}h2{font-size:clamp(1.5rem,3vw,2rem);line-height:1.2;letter-spacing:-.025em;margin:.15em 0 .7em}h3{font-size:1.13rem;margin:0 0 .4em}p{margin:.7em 0 1em;max-width:75ch}.lead{font-size:1.1rem;color:var(--muted)}.hero .lead{color:#e3edfb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:24px 0}.tile{background:#f6f9fe;border:1px solid var(--line);border-radius:12px;padding:19px}.tile p{margin-bottom:0}.kicker{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.pill{display:inline-block;border-radius:50px;padding:5px 12px;background:#e1edff;color:#174a9e;font-weight:700;font-size:.85rem}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:28px;border-top:1px solid var(--line);padding-top:22px}.btn{border-radius:9px;border:2px solid transparent;padding:12px 20px;background:var(--blue);color:white;font-weight:750;cursor:pointer;min-height:48px}.btn:hover:not(:disabled){filter:brightness(.91)}.btn.secondary{background:white;color:var(--navy);border-color:#bbcce0}.choices{display:grid;gap:11px;margin:23px 0}.choice{background:white;border:2px solid #d4e0ee;border-radius:12px;display:flex;text-align:left;align-items:flex-start;gap:12px;padding:15px;cursor:pointer;color:var(--ink);width:100%}.choice:hover:not(:disabled){border-color:#7399d7;background:#f5f9ff}.choice[aria-pressed="true"]{background:#edf4ff;border-color:var(--blue)}.choice:disabled{cursor:default}.letter{background:#eaf0f9;border-radius:7px;padding:2px 9px;font-weight:800}.feedback{margin:18px 0;background:#f1f7fd;border-left:5px solid var(--blue);padding:15px 19px;border-radius:5px}.feedback.good{background:#edf8f1;border-color:var(--green)}.feedback.caution{background:#fff6eb;border-color:#b16a14}.feedback strong{display:block;margin-bottom:5px}.scenario{border-left:5px solid #79a3ec;background:#f0f5ff;padding:19px 23px;border-radius:6px;margin:20px 0}.minor{color:var(--muted);font-size:.91rem}.checklist{padding-left:23px}.checklist li{padding-bottom:9px}.score{font-size:3rem;font-weight:800;line-height:1;color:var(--navy)}.footer{text-align:center;color:var(--muted);font-size:.83rem;padding:0 24px 28px}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.shell{padding-left:14px;padding-right:14px}.top .shell{align-items:flex-start;flex-direction:column;gap:3px}.panel{border-radius:12px;padding:22px}.hero{margin:-4px -4px 22px;padding:26px}.progress-area .shell{gap:12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a href="#main" class="skip">Skip to course content</a>
<header class="top"><div class="shell"><div class="brand">RESPONSIBLE AI <span style="color:#80adff">/ AT WORK</span></div><div class="tag">Interactive microlearning · 5–7 minutes</div></div></header>
<div class="progress-area"><div class="shell"><span id="step" class="step" aria-live="polite">Section 1 of 6</span><div class="progress" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div id="bar"></div></div></div></div>
<main class="shell" id="main" tabindex="-1"><article class="panel" id="content" aria-live="polite"></article></main>
<footer class="footer">An independent instructional design portfolio demonstration · Not affiliated with or endorsed by any employer.</footer>
<script>
'use strict';
const el=document.getElementById('content'), step=document.getElementById('step'), bar=document.getElementById('bar'), prog=document.getElementById('progress');
let page=0; const answers={};
const questions=[
{intro:'You are preparing a customer-facing summary. A colleague suggests pasting a client support ticket—including names and account details—into a public AI chatbot to save time.',question:'What is the best next step?',options:['Paste the ticket, then delete the chatbot conversation.','Remove identifiers and use only an approved AI tool according to company policy, if the task is permitted.','Ask the chatbot to promise not to store the data.'],correct:1,why:'Privacy comes first. Removing identifiers reduces risk, but you must still follow data-handling rules and use only approved tools. Deleting a chat or asking for a promise is not an adequate control.'},
{intro:'An AI assistant drafts a confident explanation of an unfamiliar cloud security control and cites a standard you have not verified. Your manager needs the summary today.',question:'What should you do?',options:['Send it as written because the citation looks credible.','Remove the citation and present the answer as your own.','Validate the claims against trusted documentation and correct or flag anything you cannot substantiate.'],correct:2,why:'AI can produce plausible but inaccurate statements and citations. Verify consequential claims against dependable sources before sharing them.'},
{intro:'Your team uses AI to help shortlist candidates. You notice the output consistently ranks applicants with nontraditional career paths lower, despite relevant skills.',question:'What is the most responsible response?',options:['Review the criteria and outputs for unfair bias, involve the appropriate people, and keep human oversight.','Accept the ranking because automation is objective.','Ask AI to select a candidate without revealing how it decided.'],correct:0,why:'AI outputs can reflect biased data or assumptions. Review the selection criteria, test for inequitable outcomes, and use appropriate human decision-making and escalation.'}
];
function btn(label,fn,kind=''){const b=document.createElement('button');b.className='btn '+kind;b.textContent=label;b.addEventListener('click',fn);return b}
function nav(next=true,back=true){const row=document.createElement('div');row.className='actions';if(back)row.append(btn('← Back',()=>go(page-1),'secondary'));else row.append(document.createElement('span'));if(next)row.append(btn(page===4?'See my results →':'Continue →',()=>go(page+1)));el.append(row)}
function render(){step.textContent=`Section ${page+1} of 6`;const pct=Math.round(page/5*100);bar.style.width=pct+'%';prog.setAttribute('aria-valuenow',String(pct));el.innerHTML='';if(page===0){el.innerHTML=`<div class="hero"><p class="eyebrow">A practical guide to better decisions</p><h1>Responsible AI at Work</h1><p class="lead">AI can accelerate your work. Your judgment is what makes its use responsible.</p><span class="pill">5–7 minutes · 3 workplace decisions</span></div><h2>What you'll be able to do</h2><div class="grid"><div class="tile"><h3>Protect information</h3><p>Recognize when workplace data should not go into an AI tool.</p></div><div class="tile"><h3>Check accuracy</h3><p>Verify AI-generated information before using it.</p></div><div class="tile"><h3>Spot potential bias</h3><p>Identify fairness concerns and apply human oversight.</p></div><div class="tile"><h3>Choose safer actions</h3><p>Make and explain responsible decisions in realistic situations.</p></div></div><p class="minor">This learning experience uses fictional scenarios and general practices. Follow your organization's actual AI, security, privacy, and data-handling policies.</p>`;nav(true,false)}
if(page===1){el.innerHTML=`<p class="eyebrow">Learn · about 1 minute</p><h2>Three checks before you use AI</h2><p class="lead">Treat AI as a useful assistant—not an authority or a substitute for accountability.</p><div class="grid"><div class="tile"><span class="pill">01 · Privacy</span><h3>Is this data safe to share?</h3><p>Confirm that the tool is approved and the content is permitted. Protect customer, employee, and confidential company information.</p></div><div class="tile"><span class="pill">02 · Accuracy</span><h3>Can I verify this output?</h3><p>Check claims, sources, calculations, and important details. Plausible wording is not proof.</p></div><div class="tile"><span class="pill">03 · Fairness</span><h3>Who could be affected?</h3><p>Review outcomes for bias, missing context, or disparate impact. Include human review for consequential decisions.</p></div><div class="tile"><span class="pill">Always · Accountability</span><h3>Who owns the decision?</h3><p>You remain responsible for how you use AI-supported work and when to escalate concerns.</p></div></div>`;nav()}
if(page>=2&&page<=4){const q=questions[page-2], selected=answers[page-2];el.innerHTML=`<p class="eyebrow">Practice · scenario ${page-1} of 3</p><h2>${['Protect customer information','Verify a convincing answer','Review a potentially biased result'][page-2]}</h2><div class="scenario"><strong>The situation</strong><p>${q.intro}</p></div><h3>${q.question}</h3><div class="choices" id="choices" role="group" aria-label="Answer choices"></div>`;const wrap=el.querySelector('#choices');q.options.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.setAttribute('aria-pressed',String(selected===i));b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span>`;b.addEventListener('click',()=>{answers[page-2]=i;render()});wrap.append(b)});if(selected!==undefined){const ok=selected===q.correct;const f=document.createElement('div');f.className='feedback '+(ok?'good':'caution');f.setAttribute('role','status');f.innerHTML=`<strong>${ok?'Strong decision.':'Consider a safer approach.'}</strong>${q.why}`;el.append(f)}const row=document.createElement('div');row.className='actions';row.append(btn('← Back',()=>go(page-1),'secondary'));const next=btn(page===4?'View my results →':'Next scenario →',()=>go(page+1));next.disabled=selected===undefined;row.append(next);el.append(row)}
if(page===5){let n=questions.filter((q,i)=>answers[i]===q.correct).length;el.innerHTML=`<p class="eyebrow">Reflect · completion</p><h2>Your responsible AI decision check</h2><p class="lead">You completed all three workplace decisions.</p><p class="score" aria-label="Score">${n} / 3</p><p>${n===3?'Excellent application of the three core safeguards.':'Review the feedback and apply the three checks to strengthen your judgment.'}</p><div class="tile"><h3>Take this into your next workday</h3><ol class="checklist"><li><strong>Protect:</strong> Is this information appropriate for an approved AI tool?</li><li><strong>Verify:</strong> Have I checked important AI-generated claims?</li><li><strong>Review:</strong> Could this output be unfair, misleading, or harmful?</li><li><strong>Own:</strong> Am I using human judgment and following policy?</li></ol></div><p class="minor">Knowledge check: ${n===3?'3 of 3 correct.':'You can retry the scenarios.'} This demonstration does not collect or transmit learner responses.</p>`;const row=document.createElement('div');row.className='actions';row.append(btn('← Review last scenario',()=>go(4),'secondary'));row.append(btn('Restart training',()=>{Object.keys(answers).forEach(k=>delete answers[k]);go(0)}));el.append(row)}
}
function go(i){page=Math.max(0,Math.min(5,i));render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true})}
render();
</script>
</body>
</html>
